<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350"><rect width="1080" height="1350" fill="#F6E7D6"/><rect x="48" y="48" width="984" height="1254" fill="none" stroke="rgba(141,75,17,0.25)" stroke-width="2"/><foreignObject x="96" y="120" width="888" height="1050"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:1050px;"><div style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;height:1050px"><div style="font:400 170px/1 'Bebas Neue', Impact, sans-serif;letter-spacing:.02em;color:#8d4b11;text-wrap:balance;">ONE FRAME FOR THE WHOLE STATE.</div><div style="height:71px"></div><div style="font:400 40px/1.35 'Manrope', system-ui, sans-serif;color:#b86216;">The white of the Rann, one colour from Kutch embroidery, and the subject held low in the frame. Every post, every week.</div></div></div></foreignObject><foreignObject x="96" y="1230" width="888" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:60px;"><div style="display:flex;justify-content:space-between;align-items:center;height:60px;font:400 24px/1 'Space Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:#b86216"><span>2 / 6</span><span>@gujarattourism</span><span style="border:1.5px solid rgba(141,75,17,0.3);border-radius:4px;padding:12px 16px 11px;font-size:19px;letter-spacing:.14em">Concept by Pratim</span></div></div></foreignObject></svg>