<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350"><rect width="1080" height="1350" fill="#EFE6D2"/><rect x="48" y="48" width="984" height="1254" fill="none" stroke="rgba(91,71,31,0.25)" stroke-width="2"/><foreignObject x="96" y="120" width="888" height="1050"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:1050px;"><div style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;height:1050px"><div style="font:400 128px/1 'Bebas Neue', Impact, sans-serif;letter-spacing:.02em;color:#5b471f;text-wrap:balance;">THE SAME CORRIDOR, 1977 AND THIS MORNING.</div><div style="height:54px"></div><div style="font:400 40px/1.35 'Manrope', system-ui, sans-serif;color:#775d28;">The carpet is new. The ceiling, the light and the doorman&#39;s post are exactly where the architects put them.</div></div></div></foreignObject><foreignObject x="96" y="1230" width="888" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:60px;"><div style="display:flex;justify-content:space-between;align-items:center;height:60px;font:400 24px/1 'Space Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:#775d28"><span>2 / 6</span><span>@itchotels</span><span style="border:1.5px solid rgba(91,71,31,0.3);border-radius:4px;padding:12px 16px 11px;font-size:19px;letter-spacing:.14em">Concept by Pratim</span></div></div></foreignObject></svg>