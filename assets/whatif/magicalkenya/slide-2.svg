ter;align-items:flex-start;text-align:left;height:1050px"><div style="font:400 24px/1 'Space Mono', ui-monospace, monospace;letter-spacing:.18em;text-transform:uppercase;color:#2E7D32;margin-bottom:30px">In her words</div><div style="font:500 68px/1.04 'Space Grotesk', system-ui, sans-serif;letter-spacing:-.025em;color:#1F2420;text-wrap:balance;">The waterfall is loud enough to hide an elephant. We listen for the birds instead.</div><div style="height:29px"></div><div style="font:400 42px/1.35 'Manrope', system-ui, sans-serif;color:#5A5F58;">Her patrol covers eleven kilometres before the lodge serves breakfast.</div></div></div></foreignObject><foreignObject x="96" y="1230" width="888" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:60px;"><div style="display:flex;justify-content:space-between;align-items:center;height:60px;font:400 24px/1 'Space Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:#5A5F58"><span>2 / 6</span><span>@magicalkenya</span><span style="border:1.5px solid rgba(31,36,32,0.3);border-radius:4px;padding:12px 16px 11px;font-size:19px;letter-spacing:.14em">Concept by Pratim</span></div></div></foreignObject></svg>