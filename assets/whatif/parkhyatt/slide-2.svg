t-align:center;height:1050px"><div style="font:300 96px/1.04 'Fraunces', Georgia, serif;letter-spacing:-.01em;color:#2B2A26;text-wrap:balance;">The water is kept at 29 degrees and the lights at half.</div><div style="height:40px"></div><div style="font:400 40px/1.35 'Manrope', system-ui, sans-serif;color:#6B675E;">Forty lengths and the city is still asleep. Breakfast is on the 44th floor when you come up.</div></div></div></foreignObject><foreignObject x="96" y="1230" width="888" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:60px;"><div style="display:flex;justify-content:space-between;align-items:center;height:60px;font:400 24px/1 'Space Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:#6B675E"><span>2 / 6</span><span>@parkhyatt</span><span style="border:1.5px solid rgba(43,42,38,0.3);border-radius:4px;padding:12px 16px 11px;font-size:19px;letter-spacing:.14em">Concept by Pratim</span></div></div></foreignObject></svg>