<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350"><rect width="1080" height="1350" fill="#0E1316"/><foreignObject x="96" y="120" width="888" height="1050"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:1050px;"><div style="display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;height:1050px"><div style="font:400 96px/1.04 'Instrument Serif', Georgia, serif;letter-spacing:-.005em;color:#E9E6DF;text-wrap:balance;">Three things to do when the cloud sits low.</div><div style="height:48px"></div><div style="display:flex;flex-direction:column;gap:24px"><div style="display:flex;gap:26px;align-items:flex-start;font:500 44px/1.25 'Manrope', system-ui, sans-serif;color:#E9E6DF"><span style="flex:none;font:400 26px/1 'Space Mono', ui-monospace, monospace;color:#8B1E2F;padding-top:11px">01</span><span>Walk to Buddha Dordenma while the city is still asleep</span></div><div style="display:flex;gap:26px;align-items:flex-start;font:500 44px/1.25 'Manrope', system-ui, sans-serif;color:#E9E6DF"><span style="flex:none;font:400 26px/1 'Space Mono', ui-monospace, monospace;color:#8B1E2F;padding-top:11px">02</span><span>Sit in the hot stone bath with the window open</span></div><div style="display:flex;gap:26px;align-items:flex-start;font:500 44px/1.25 'Manrope', system-ui, sans-serif;color:#E9E6DF"><span style="flex:none;font:400 26px/1 'Space Mono', ui-monospace, monospace;color:#8B1E2F;padding-top:11px">03</span><span>Let the driver take the long road to Punakha</span></div></div></div></div></foreignObject><foreignObject x="96" y="1230" width="888" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:60px;"><div style="display:flex;justify-content:space-between;align-items:center;height:60px;font:400 24px/1 'Space Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(233,230,223,.72)"><span>4 / 6</span><span>@tajhotels</s