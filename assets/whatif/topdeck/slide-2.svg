<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350"><rect width="1080" height="1350" fill="#F2D22E"/><foreignObject x="96" y="120" width="888" height="1050"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:1050px;"><div style="display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;height:1050px"><div style="font:700 136px/1.04 'Space Grotesk', system-ui, sans-serif;letter-spacing:-.03em;color:#141414;text-wrap:balance;">In Jess&#39;s words.</div><div style="height:57px"></div><div style="font:400 42px/1.35 'Manrope', system-ui, sans-serif;color:rgba(20,20,20,0.78);">Thirteen days, seven cities, one bus, and the Great Wall at Jinshanling before the coaches arrive. I&#39;ve done the route twice. Ask me anything in the comments.</div></div></div></foreignObject><foreignObject x="96" y="1230" width="888" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="width:888px;height:60px;"><div style="display:flex;justify-content:space-between;align-items:center;height:60px;font:400 24px/1 'Space Mono', ui-monospace, monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(20,20,20,0.78)"><span>2 / 6</span><span>@topdecktravel</span><span style="border:1.5px solid rgba(20,20,20,0.3);border-radius:4px;padding:12px 16px 11px;font-size:19px;letter-spacing:.14em">Concept by Pratim</span></div></div></foreignObject></svg>